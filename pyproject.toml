[project]
name = "chakki-erp"
version = "1.0.0"
description = "Mobile-first bilingual flour mill management and accounting ERP"
requires-python = ">=3.12"
dependencies = [
  "Django==6.0.8",
  "psycopg[binary]>=3.2,<4",
  "whitenoise>=6.9,<7",
  "gunicorn>=23,<24",
  "python-dotenv>=1.1,<2",
  "qrcode[pil]>=8.2,<9",
  "cryptography>=46,<47",
]

[tool.ruff]
line-length = 120
target-version = "py312"
