{% for field in form %}<div class="space-y-1.5"><label for="{{ field.id_for_label }}" class="ui-label block">{{ field.label }}{% if field.field.required %}<span class="text-destructive"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<div class="text-xs text-muted-foreground">{{ field.help_text }}</div>{% endif %}{% for error in field.errors %}<div class="text-xs font-medium text-destructive">{{ error }}</div>{% endfor %}</div>{% endfor %}{% if form.non_field_errors %}<div class="rounded-lg border border-destructive/30 bg-destructive/10 p-3 text-sm text-destructive">{{ form.non_field_errors }}</div>{% endif %}
