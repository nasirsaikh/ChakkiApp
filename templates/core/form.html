{% extends "base.html" %}{% load i18n %}{% block title %}{{ title }}{% endblock %}
{% block content %}<div class="mx-auto max-w-2xl"><div class="mb-4 flex items-center justify-between"><div><h1 class="text-xl font-bold sm:text-2xl">{{ title }}</h1><p class="text-sm text-muted-foreground">{% trans "Fields marked with * are required." %}</p></div></div><form method="post" class="space-y-4 rounded-2xl border border-border bg-card p-4 shadow-sm sm:p-6">{% csrf_token %}{% include "core/_form_fields.html" %}<div class="flex gap-2 pt-2"><button class="rounded-xl bg-primary px-5 py-3 text-sm font-semibold text-white">{% trans "Save" %}</button><a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="rounded-xl border border-input px-5 py-3 text-sm font-semibold">{% trans "Cancel" %}</a></div></form></div>{% endblock %}
