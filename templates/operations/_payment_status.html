{% load i18n %}{% if payment.settlement_status == 'SETTLED' %}<div class="rounded-xl bg-primary/10 p-4 font-bold text-primary">✓ {% trans "Paid & Cleared" %}<div class="mt-1 text-xs font-normal">{{ payment.settled_at|date:'d M Y H:i:s' }}</div></div>{% elif payment.settlement_status == 'FAILED' %}<div class="rounded-xl bg-red-50 p-4 font-bold text-red-800">{% trans "Payment Failed" %}</div>{% else %}<div class="rounded-xl bg-amber-50 p-4 font-semibold text-amber-800"><span class="inline-block animate-pulse">●</span> {% trans "Awaiting Payment" %}</div>{% endif %}
