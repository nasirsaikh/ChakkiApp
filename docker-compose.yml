services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chakki
      POSTGRES_USER: chakki
      POSTGRES_PASSWORD: chakki
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: "replace-this-secret"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      DATABASE_URL: "postgresql://chakki:chakki@db:5432/chakki"
    depends_on:
      - db
volumes:
  postgres_data:
